:root {
  --verde:   #009c3b;
  --verde2:  #007a2e;
  --amarelo: #FFDF00;
  --azul:    #002776;
  --branco:  #ffffff;
  --creme:   #fffef5;
  --cinza:   #f0efe8;
  --texto:   #1a1a2e;
  --sombra:  rgba(0,39,118,0.14);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:'Nunito',sans-serif; background:var(--creme); color:var(--texto); overflow-x:hidden; }

/* ── CONFETES ── */
.confetes { position:fixed; inset:0; pointer-events:none; z-index:999; overflow:hidden; }
.confete { position:absolute; top:-18px; border-radius:2px; animation:cair linear infinite; }
@keyframes cair { to { transform:translateY(110vh) rotate(900deg); opacity:0; } }

/* ── HERO ── */
.hero {
  background:linear-gradient(160deg, var(--azul) 0%, #001850 100%);
  position:relative; overflow:hidden;
  padding:60px 24px 70px; text-align:center;
}
.hero::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(0,156,59,0.25) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 20%, rgba(255,223,0,0.15) 0%, transparent 50%);
}
.hero-bandeira { font-size:2.6rem; letter-spacing:4px; margin-bottom:20px; animation:fadeUp .7s both; }
.hero-tag {
  display:inline-block; background:var(--amarelo); color:var(--azul);
  font-weight:900; font-size:.72rem; letter-spacing:3.5px; text-transform:uppercase;
  padding:6px 20px; border-radius:50px; margin-bottom:22px; animation:fadeUp .7s .1s both;
}
.hero h1 {
  font-family:'Playfair Display',serif;
  font-size:clamp(2.2rem,7vw,4.2rem); color:var(--branco);
  line-height:1.12; margin-bottom:18px; animation:fadeUp .7s .2s both;
}
.hero h1 em { color:var(--amarelo); font-style:italic; }
.hero-sub {
  color:rgba(255,255,255,.75); font-size:1.05rem; font-weight:600;
  max-width:560px; margin:0 auto 32px; line-height:1.65; animation:fadeUp .7s .3s both;
}
.hero-data { display:inline-flex; gap:16px; flex-wrap:wrap; justify-content:center; animation:fadeUp .7s .4s both; }
.data-chip {
  background:rgba(255,255,255,.1); border:1.5px solid rgba(255,223,0,.5);
  color:var(--amarelo); font-weight:700; font-size:.88rem;
  padding:8px 20px; border-radius:50px;
}

/* ── SEÇÃO GENÉRICA ── */
.container { max-width:860px; margin:0 auto; }
.secao-label {
  display:inline-block; background:var(--verde); color:var(--branco);
  font-weight:900; font-size:.7rem; letter-spacing:3px; text-transform:uppercase;
  padding:5px 16px; border-radius:50px; margin-bottom:16px;
}
section { padding:64px 24px; }

/* ── HISTÓRIA ── */
.historia { background:var(--branco); }
.historia h2 {
  font-family:'Playfair Display',serif;
  font-size:clamp(1.7rem,5vw,2.6rem); color:var(--azul);
  margin-bottom:28px; line-height:1.2;
}
.historia h2 span { color:var(--verde); }
.historia-texto { font-size:1.05rem; line-height:1.85; color:#333; }
.historia-texto p { margin-bottom:18px; }
.historia-texto strong { color:var(--azul); }
.destaque-box {
  background:linear-gradient(135deg,#f0fff6,#e8f5ff);
  border-left:5px solid var(--verde); border-radius:0 14px 14px 0;
  padding:22px 24px; margin:28px 0;
  font-size:1.02rem; color:var(--azul); font-weight:700; line-height:1.7;
}
.destaque-box .icone { font-size:1.6rem; margin-bottom:8px; display:block; }

}
.linha { display:flex; flex-direction:column; position:relative; max-width:600px; }
.linha::before {
  content:''; position:absolute; left:22px; top:0; bottom:0; width:3px;
  background:linear-gradient(to bottom,var(--verde),var(--amarelo),var(--azul));
  border-radius:3px;
}
.linha-item { display:flex; gap:20px; align-items:flex-start; padding-bottom:32px; position:relative; }

}
